<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The big screen — The Story Garden</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<style>
  :root{
    --navy:#22304A;--cream:#F9F5EA;--butter:#E9C46A;--dusty:#8FA3BF;
    --display:"Hoefler Text",Baskerville,"Iowan Old Style",Georgia,serif;
    --script:"Snell Roundhand","Apple Chancery",cursive;
    --body:"Seravek","Avenir Next",Avenir,"Gill Sans",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--navy);color:var(--cream);font-family:var(--body);overflow:hidden}
  .lights{position:fixed;top:0;left:0;width:100%;height:60px;z-index:2}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:70px 40px 90px}
  .slide{position:absolute;inset:70px 40px 90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;opacity:0;transition:opacity 1.6s ease;pointer-events:none}
  .slide.on{opacity:1}
  .slide img{max-height:78vh;max-width:92vw;border:10px solid #FFFDF6;border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .slide .cap{font-family:var(--script);font-size:clamp(26px,3.6vw,40px);color:var(--butter);text-align:center;max-width:26ch}
  .slide .quote{font-family:var(--display);font-size:clamp(30px,4.6vw,52px);letter-spacing:.06em;text-align:center;max-width:22ch;line-height:1.3}
  .slide .quote-sub{font-family:var(--script);font-size:clamp(22px,3vw,32px);color:var(--butter)}
  .brand{position:fixed;bottom:26px;left:0;width:100%;text-align:center;font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:#8390A8;z-index:2}
  /* scan-to-add corner: QR + the invitation to pile on photos */
  .scanme{position:fixed;left:26px;bottom:22px;z-index:3;display:flex;align-items:center;gap:16px}
  .scanme img{width:112px;height:112px;background:#FFFDF6;padding:8px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .scanme p{font-family:var(--script);font-size:23px;color:var(--butter);line-height:1.3;margin:0;text-align:left;text-shadow:0 2px 8px rgba(0,0,0,.4)}
  .scanme strong{display:block;color:var(--cream);font-weight:400;margin-top:4px}
  /* on a phone the corner would collide with captions — tuck it in smaller */
  @media (max-width:700px){
    .scanme{bottom:64px;gap:10px}
    .scanme img{width:64px;height:64px;padding:5px}
    .scanme p{font-size:15px}
  }
  .firefly{position:fixed;width:4px;height:4px;border-radius:50%;background:var(--butter);box-shadow:0 0 8px 2px rgba(233,196,106,.5);opacity:0;animation:drift 11s ease-in-out infinite;z-index:1}
  .firefly:nth-of-type(2){animation-delay:3s;animation-duration:13s}
  .firefly:nth-of-type(3){animation-delay:7s;animation-duration:15s}
  @keyframes drift{
    0%{transform:translate(0,0);opacity:0}
    20%{opacity:.9}
    50%{transform:translate(50px,-80px);opacity:.3}
    80%{opacity:.85}
    100%{transform:translate(-30px,-150px);opacity:0}
  }
  @media (prefers-reduced-motion:reduce){
    .firefly{animation:none;opacity:.4}
    .slide{transition:none}
  }
  .exit{position:fixed;top:16px;right:16px;z-index:5;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;color:rgba(249,245,234,.55);background:rgba(34,48,74,.5);border:1px solid rgba(249,245,234,.3);border-radius:50%;text-decoration:none}
  .exit:hover,.exit:focus-visible{color:var(--cream);border-color:var(--cream)}
  /* presentation mode: one tap, everything but the garden disappears */
  .fs{position:fixed;top:16px;left:16px;z-index:5;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;color:rgba(249,245,234,.55);background:rgba(34,48,74,.5);border:1px solid rgba(249,245,234,.3);border-radius:50%;cursor:pointer;padding:0}
  .fs:hover,.fs:focus-visible{color:var(--cream);border-color:var(--cream)}
  :fullscreen .fs,:fullscreen .exit{opacity:0;pointer-events:none}
</style>
<meta property="og:type" content="website">
<meta property="og:site_name" content="The Story Garden">
<meta property="og:title" content="The big screen — The Story Garden">
<meta property="og:description" content="Saturday, August 15th at 7 pm · Grandma's garden, Orem · details, registry, and RSVP inside.">
<meta property="og:url" content="https://babywhiteshower.com/slideshow.html">
<meta property="og:image" content="https://babywhiteshower.com/assets/invites/og-invite.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<svg class="lights" viewBox="0 0 960 60" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 10 Q240 48 480 24 T960 14" stroke="rgba(249,245,234,.3)" stroke-width="1.5" fill="none"/>
  <g fill="#E9C46A">
    <circle cx="120" cy="32" r="4"/><circle cx="120" cy="32" r="8" opacity=".22"/>
    <circle cx="300" cy="40" r="4"/><circle cx="300" cy="40" r="8" opacity=".22"/>
    <circle cx="480" cy="28" r="4"/><circle cx="480" cy="28" r="8" opacity=".22"/>
    <circle cx="660" cy="26" r="4"/><circle cx="660" cy="26" r="8" opacity=".22"/>
    <circle cx="840" cy="20" r="4"/><circle cx="840" cy="20" r="8" opacity=".22"/>
  </g>
</svg>
<span class="firefly" style="left:12%;top:70%"></span>
<span class="firefly" style="left:82%;top:60%"></span>
<span class="firefly" style="left:50%;top:78%"></span>

<a class="exit" href="the-evening.html" aria-label="Leave the slideshow" title="Back to the party page">×</a>
<button class="fs" id="fs-btn" type="button" aria-label="Play full screen" title="Play full screen (Esc to leave)">⛶</button>

<div class="stage" id="stage" role="img" aria-label="Slideshow of the Story Garden shared album"></div>

<p class="brand">The Story Garden · August 15th, 2026</p>

<div class="scanme">
  <img src="assets/invites/qr-evening.png" alt="Scan to open the party page">
  <p>add your photos from tonight<br>and they land here…<strong>most photos shared wins a prize!!</strong></p>
</div>

<script src="assets/config.js?v=18"></script>
<script src="assets/backend.js?v=36"></script>
<script>
  var SLIDES=[
    {quote:'A new chapter begins',sub:'Baby Boy White · arriving October 14th'},
    {img:'assets/photos/baby-abby.jpg',cap:'Abby, once upon a time'},
    {img:'assets/photos/baby-beau.jpg',cap:'and Beau, already in his blues'},
    {quote:'Every story is beautiful, but ours is our favorite',sub:'we can’t wait to meet him'},
    {quote:'Your photo lands here tonight',sub:'add it from the party page on your phone'}
  ];
  var stage=document.getElementById('stage');
  SLIDES.forEach(function(s){
    var d=document.createElement('div');
    d.className='slide';
    if(s.img){
      var im=document.createElement('img');
      im.src=s.img;im.alt='';
      d.appendChild(im);
      var c=document.createElement('p');c.className='cap';c.textContent=s.cap;
      d.appendChild(c);
    }else{
      var q=document.createElement('p');q.className='quote';q.textContent=s.quote;
      d.appendChild(q);
      var su=document.createElement('p');su.className='quote-sub';su.textContent=s.sub;
      d.appendChild(su);
    }
    stage.appendChild(d);
  });
  var slides=stage.children;
  var i=0;
  slides[0].classList.add('on');
  function next(){
    slides[i].classList.remove('on');
    i=(i+1)%slides.length;
    slides[i].classList.add('on');
  }
  var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduced)setInterval(next,6000);
  document.addEventListener('click',function(e){
    if(e.target.closest&&e.target.closest('.exit'))return;
    next();
  });
  document.addEventListener('keydown',function(e){
    // in fullscreen, Escape leaves fullscreen (the browser handles it);
    // only bounce back to the party page from the windowed view
    if(e.key==='Escape'&&!document.fullscreenElement)window.location.href='the-evening.html';
    if(e.key==='f'||e.key==='F')toggleFs();
  });
  function toggleFs(){
    var el=document.documentElement;
    if(document.fullscreenElement){document.exitFullscreen()}
    else if(el.requestFullscreen){el.requestFullscreen().catch(function(){})}
    else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen()}
  }
  document.getElementById('fs-btn').addEventListener('click',function(e){
    e.stopPropagation(); // don't also advance the slide
    toggleFs();
  });

  // hold a screen wake lock so the screensaver can't interrupt the show;
  // re-acquire it whenever the tab becomes visible again
  function keepAwake(){
    if(!('wakeLock' in navigator))return;
    navigator.wakeLock.request('screen').catch(function(){});
  }
  keepAwake();
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible')keepAwake();
  });

  // live sync: photos guests add on the party page join the loop
  if(window.SG&&SG.enabled){
    var seen={};
    function addSlide(row){
      if(seen[row.id])return;
      seen[row.id]=true;
      var d=document.createElement('div');
      d.className='slide';
      var im=document.createElement('img');
      im.src=row.photo_url;im.alt='';
      d.appendChild(im);
      var c=document.createElement('p');
      c.className='cap';
      c.textContent=row.caption||'from tonight, under the string lights';
      d.appendChild(c);
      stage.appendChild(d);
    }
    var pull=function(){
      SG.listAlbum().then(function(rows){rows.forEach(addSlide)}).catch(function(){});
    };
    pull();
    setInterval(pull,20000);
  }
</script>
</body>
</html>
